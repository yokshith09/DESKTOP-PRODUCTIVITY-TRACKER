name: End-to-end

# F1-27: the real app, built and driven like a person would use it.
#  - Windows: WebDriver (tauri-driver + Microsoft Edge Driver) runs e2e/app.e2e.mjs: first-run
#    welcome, a task, a note, a meeting with an action item turned into a task, then a restart
#    to prove everything was saved.
#  - macOS: Apple offers no WebDriver for the app's webview, so e2e/smoke.mjs only checks that
#    the app starts, opens its database, logs, and stays up.
# Every run uses a fresh temporary data folder (LOAF_DATA_DIR), never real data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: e2e (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: pnpm install --frozen-lockfile
      - name: Build the app (debug, UI embedded, no installer)
        run: pnpm tauri build --debug --no-bundle
      - name: Install tauri-driver and a matching Microsoft Edge Driver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the end-to-end tests
        run: pnpm e2e

  macos:
    name: smoke (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: pnpm install --frozen-lockfile
      - name: Build the app (debug, UI embedded, no installer)
        run: pnpm tauri build --debug --no-bundle
      - name: Launch smoke test
        run: pnpm e2e:smoke
