name: Release build

# Builds the Windows and macOS installers and keeps them as a DRAFT GitHub Release. Nothing is
# published until you press "Publish release" on the draft.
#
# It starts by itself when the app version changes on `main` (src-tauri/tauri.conf.json), so a
# release is: bump the version, push to main, wait, test the draft's installers, publish. It also
# starts when you push a tag `v*` or press "Run workflow" in the Actions tab. If a release for the
# version already exists (draft or published), a version-change push does nothing.
#
# Publishing the draft creates the tag `v<version>` on the commit that was built.
# To rebuild the same version (for example after a fix), change this file or press "Run workflow".
#
# Signing is NOT set up: it needs the owner's certificates. Unsigned installers work, but Windows
# SmartScreen and macOS Gatekeeper will warn. To sign, add the secrets listed below to the
# repository and uncomment the `env` block of the build step.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # A branch push only builds when the version file (or this workflow) changes.
    paths:
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; else tag="v$version"; fi
          build=true
          # An automatic branch push must not rebuild a release that already exists.
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            if gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' | grep -qx "$tag"; then
              build=false
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (build: $build)"

  installers:
    name: installers (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build the app and its installers
        run: pnpm tauri build
        # env:
        #   Windows: TAURI_SIGNING_PRIVATE_KEY / certificate settings (see Tauri's Windows signing guide)
        #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        #            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: actions/upload-artifact@v4
        with:
          name: loaf-installers-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  draft-release:
    name: draft GitHub release
    needs: [plan, installers]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create (or refresh) the draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \))
          if [ "${#files[@]}" -eq 0 ]; then echo "No installers were built."; exit 1; fi
          if gh release list --repo "$REPO" --limit 100 --json tagName -q '.[].tagName' | grep -qx "$TAG"; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            flags=(--draft --generate-notes --target "$SHA")
            case "$TAG" in *-*) flags+=(--prerelease);; esac
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --title "Loaf $TAG" "${flags[@]}"
          fi
