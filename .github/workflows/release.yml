name: Release build

# G4 (M1 release gate): build the installers on both operating systems and keep them as
# downloadable artifacts. Run it by hand (Actions → "Release build" → Run workflow) or by pushing
# a tag like v0.1.0. Nothing is published automatically.
#
# Signing is NOT set up yet: it needs the owner's certificates. Unsigned installers work, but
# Windows SmartScreen and macOS Gatekeeper will warn. To sign, add the secrets listed below to the
# repository and uncomment the `env` block.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build the app and its installers
        run: pnpm tauri build
        # env:
        #   Windows: TAURI_SIGNING_PRIVATE_KEY / certificate settings (see Tauri's Windows signing guide)
        #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
        #            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      - uses: actions/upload-artifact@v4
        with:
          name: loaf-installers-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
